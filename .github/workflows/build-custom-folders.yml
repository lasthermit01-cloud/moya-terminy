name: Build Custom Folders APK

on:
  push:
    branches: [ custom-folders ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply v1.1 source patches
        run: |
          cat custom-folders-project/patches/EditorActivity.java.part* > custom-folders-project/app/src/main/java/com/customfolders/app/EditorActivity.java
          cat custom-folders-project/patches/MainActivity.java.part* > custom-folders-project/app/src/main/java/com/customfolders/app/MainActivity.java
      - name: Install Android SDK packages
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: custom-folders-project
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MoiPapky-v1.1-debug-apk
          path: custom-folders-project/app/build/outputs/apk/debug/app-debug.apk
