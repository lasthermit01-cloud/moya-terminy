name: Build Custom Folders APK

on:
  workflow_dispatch:
  push:
    branches: [ custom-folders ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore source archive
        run: |
          cat custom-folders-source/cfpart*.txt > /tmp/custom-folders.b64
          base64 -d /tmp/custom-folders.b64 > /tmp/custom-folders.zip
          unzip -t /tmp/custom-folders.zip
          mkdir -p /tmp/custom-folders-src
          unzip -q /tmp/custom-folders.zip -d /tmp/custom-folders-src
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: /tmp/custom-folders-src/CustomFolders
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MoiPapky-debug-apk
          path: /tmp/custom-folders-src/CustomFolders/app/build/outputs/apk/debug/app-debug.apk
