name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ moya-terminy, main ]
  pull_request:
    branches: [ moya-terminy, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify source
        run: |
          cat source_parts/part*.txt | tr -d '\n\r' | base64 -d > source.zip
          unzip -t source.zip
          unzip -q source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: MoiTerminy
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MoiTerminy-debug-apk
          path: MoiTerminy/app/build/outputs/apk/debug/app-debug.apk
